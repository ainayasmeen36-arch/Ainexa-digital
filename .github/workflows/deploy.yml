# Uploads Next.js `out/` to Hostinger after every push/merge to main.
#
# Secrets (repo → Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_SERVER      FTP hostname or IP from the SAME FTP card (not https://)
#   HOSTINGER_FTP_USERNAME    FULL Hostinger username, e.g. u12345678 or u12345678.ainexadeploy
#                             (not just ainexadeploy, not your email)
#   HOSTINGER_FTP_PASSWORD    that FTP user's password (spaces/quotes stripped by the script)
#   HOSTINGER_FTP_REMOTE_DIR  public_html     (NOT out — out is only the local build folder)
#
# Also enable hPanel → Remote access → SFTP (port 65002). Extra FTP accounts cannot
# log in as the short name; copy the full username Hostinger shows in the list.
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y lftp

      - name: Upload out/ to Hostinger
        env:
          FTP_SERVER: ${{ secrets.HOSTINGER_FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          FTP_REMOTE_DIR: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
        run: python3 scripts/deploy-hostinger.py
