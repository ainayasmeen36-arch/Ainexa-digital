# Auto-deploy static Next.js export to Hostinger when main updates
# (including after a pull request is merged).
#
# Required GitHub secrets (repo → Settings → Secrets and variables → Actions):
#   HOSTINGER_FTP_SERVER      e.g. ftp.ainexia.com  (hPanel → Files → FTP Accounts)
#   HOSTINGER_FTP_USERNAME
#   HOSTINGER_FTP_PASSWORD
#   HOSTINGER_FTP_REMOTE_DIR  usually public_html/  — if FTP already opens inside public_html, use ./
name: Deploy to Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run build

      - name: Upload out/ to Hostinger
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_FTP_SERVER }}
          username: ${{ secrets.HOSTINGER_FTP_USERNAME }}
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          local-dir: ./out/
          server-dir: ${{ secrets.HOSTINGER_FTP_REMOTE_DIR }}
          protocol: ftp
          timeout: 600000
